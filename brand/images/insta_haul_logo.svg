<svg viewBox="150 15 380 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ig1" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#D94F00"/>
      <stop offset="50%" stop-color="#F28C00"/>
      <stop offset="100%" stop-color="#F5C200"/>
    </linearGradient>
    <linearGradient id="ig2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#B84200"/>
      <stop offset="100%" stop-color="#E07A00"/>
    </linearGradient>
    <linearGradient id="truck-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E8E8E8" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="truck-cab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#D0D0D0" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Icon background -->
  <rect x="220" y="30" width="240" height="240" rx="56" fill="url(#ig1)"/>
  <rect x="232" y="42" width="216" height="216" rx="46" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>
  <rect x="255" y="65" width="170" height="170" rx="34" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="5"/>

  <!-- Truck cargo box -->
  <rect x="268" y="115" width="104" height="68" rx="7" fill="url(#truck-body)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <!-- Truck cab -->
  <path d="M372 140 L372 183 L408 183 L408 163 Q408 140 388 140 Z" fill="url(#truck-cab)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <!-- Cab window -->
  <path d="M376 147 L376 169 L401 169 L401 163 Q401 147 388 147 Z" fill="rgba(210,240,255,0.7)"/>
  <!-- Undercarriage -->
  <line x1="268" y1="183" x2="408" y2="183" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <!-- Rear wheel -->
  <circle cx="300" cy="191" r="14" fill="url(#ig2)"/>
  <circle cx="300" cy="191" r="8" fill="rgba(255,255,255,0.9)"/>
  <circle cx="300" cy="191" r="3.5" fill="url(#ig2)"/>
  <!-- Front wheel -->
  <circle cx="387" cy="191" r="14" fill="url(#ig2)"/>
  <circle cx="387" cy="191" r="8" fill="rgba(255,255,255,0.9)"/>
  <circle cx="387" cy="191" r="3.5" fill="url(#ig2)"/>
  <!-- Speed lines -->
  <line x1="278" y1="135" x2="265" y2="135" stroke="rgba(255,255,255,0.5)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="278" y1="143" x2="260" y2="143" stroke="rgba(255,255,255,0.4)" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="278" y1="151" x2="263" y2="151" stroke="rgba(255,255,255,0.3)" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Accent dot -->
  <circle cx="387" cy="72" r="8" fill="rgba(255,255,255,0.85)"/>
  <circle cx="387" cy="72" r="4" fill="url(#ig2)"/>

  <!-- Wordmark -->
  <text x="340" y="320"
        text-anchor="middle"
        font-family="'Trebuchet MS', 'Franklin Gothic Medium', Arial, sans-serif"
        font-size="54"
        font-weight="800"
        letter-spacing="-1">
    <tspan fill="#D94F00">insta</tspan><tspan fill="#1A1A1A">-haul</tspan>
  </text>

  <!-- Tagline -->
  <text x="340" y="358"
        text-anchor="middle"
        font-family="'Trebuchet MS', Arial, sans-serif"
        font-size="15"
        letter-spacing="4"
        fill="#888888">
    FAST. RELIABLE. HAULING.
  </text>
</svg>
